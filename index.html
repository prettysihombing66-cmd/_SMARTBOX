<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0}</style><title>SMART BOX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Tata letak: satu panggung 3D di tengah. Kotak tertutup berputar pelan, setelah murid masuk
   tutupnya terbuka dan keempat sisinya rebah menjadi kartu. Panel isi naik di atas panggung,
   bilah tab di bawah selalu menampilkan empat sisi. Warna mengikuti tema pelajaran (--h dan --c1..--c4). */
:root{
  --h:210;
  --font-display:'Baloo 2','Fredoka','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg1:hsl(var(--h) 100% 97%);
  --bg2:hsl(var(--h) 88% 92%);
  --bg3:hsl(var(--h) 80% 84%);
  --surface:#ffffff;
  --surface2:hsl(var(--h) 100% 96%);
  --ink:hsl(var(--h) 48% 20%);
  --ink2:hsl(var(--h) 24% 38%);
  --line:hsl(var(--h) 60% 88%);
  --outline:hsl(var(--h) 42% 30%);
  --accent:hsl(var(--h) 62% 43%);
  --accent2:hsl(var(--h) 62% 50%);
  --accent-ink:#ffffff;
  --shadow:hsl(var(--h) 60% 40% / .18);
  --deco:rgba(255,255,255,.85);
  --good:#0f9d6b; --bad:#d6366b; --warn:#b36b00;
  --c1:#ff7fa8; --c2:#ffb84d; --c3:#3fcf9d; --c4:#9b7bff;
  --cl1:color-mix(in srgb,var(--c1) 60%,#fff); --cl2:color-mix(in srgb,var(--c2) 60%,#fff);
  --cl3:color-mix(in srgb,var(--c3) 60%,#fff); --cl4:color-mix(in srgb,var(--c4) 60%,#fff);
  --cd1:color-mix(in srgb,var(--c1) 62%,#1c2748); --cd2:color-mix(in srgb,var(--c2) 62%,#1c2748);
  --cd3:color-mix(in srgb,var(--c3) 62%,#1c2748); --cd4:color-mix(in srgb,var(--c4) 62%,#1c2748);
  --ease:cubic-bezier(.22,.9,.3,1);
  --spring:cubic-bezier(.34,1.5,.5,1);
  --s:clamp(86px,min(27vw,23vh),224px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg1:hsl(var(--h) 60% 12%); --bg2:hsl(var(--h) 58% 17%); --bg3:hsl(var(--h) 55% 25%);
  --surface:hsl(var(--h) 45% 17%); --surface2:hsl(var(--h) 45% 21%);
  --ink:hsl(var(--h) 100% 95%); --ink2:hsl(var(--h) 40% 76%);
  --line:hsl(var(--h) 35% 30%); --outline:hsl(var(--h) 70% 6%);
  --accent:hsl(var(--h) 95% 62%); --accent2:hsl(var(--h) 95% 70%); --accent-ink:hsl(var(--h) 80% 10%);
  --shadow:rgba(0,0,0,.45); --deco:rgba(255,255,255,.14);
  --good:#4fe0aa; --bad:#ff7aa6; --warn:#ffc266; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg1:hsl(var(--h) 60% 12%); --bg2:hsl(var(--h) 58% 17%); --bg3:hsl(var(--h) 55% 25%);
  --surface:hsl(var(--h) 45% 17%); --surface2:hsl(var(--h) 45% 21%);
  --ink:hsl(var(--h) 100% 95%); --ink2:hsl(var(--h) 40% 76%);
  --line:hsl(var(--h) 35% 30%); --outline:hsl(var(--h) 70% 6%);
  --accent:hsl(var(--h) 95% 62%); --accent2:hsl(var(--h) 95% 70%); --accent-ink:hsl(var(--h) 80% 10%);
  --shadow:rgba(0,0,0,.45); --deco:rgba(255,255,255,.14);
  --good:#4fe0aa; --bad:#ff7aa6; --warn:#ffc266; color-scheme:dark;}
/* tema pelajaran */
:root[data-tema="laut"]{--h:182;--c1:#ff8a65;--c2:#ffd45c;--c3:#2fd4c0;--c4:#6c8cff}
:root[data-tema="hutan"]{--h:140;--c1:#ff9a5c;--c2:#e8d34a;--c3:#2fc785;--c4:#b58cff}
:root[data-tema="senja"]{--h:24;--c1:#ff6f91;--c2:#ffb347;--c3:#59c9a5;--c4:#8f7bff}
:root[data-tema="taman"]{--h:285;--c1:#ff7fbf;--c2:#ffc857;--c3:#4fd6a6;--c4:#6fa8ff}

*{box-sizing:border-box}
.chip.baru{background:var(--c2);color:#2b1b00;border:2px solid var(--outline)}
#tabs .tab[data-new]{position:relative}
#tabs .tab[data-new]::after{content:"";position:absolute;top:2px;right:8px;width:12px;height:12px;border-radius:50%;background:#ff5d6c;border:2px solid var(--outline)}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg1);color:var(--ink);font:600 16px/1.5 var(--font-body);padding-inline:16px;padding-block:0;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance;font-weight:800}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{max-width:1120px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1}
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:linear-gradient(180deg,var(--bg2) 0%,var(--bg1) 55%,var(--bg1) 100%)}
.sky::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-22vh;height:44vh;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,var(--bg3),transparent 70%);opacity:.7}
.deco{position:absolute;width:var(--w);height:calc(var(--w)*.5);left:var(--x);top:var(--y);background:var(--deco);border-radius:999px;animation:drift var(--d) ease-in-out infinite alternate;filter:blur(.3px)}
.deco{box-shadow:inset 0 -10px 0 hsl(var(--h) 80% 86% / .55),0 12px 18px hsl(var(--h) 60% 60% / .12)}
.deco::before,.deco::after{content:"";position:absolute;background:inherit;border-radius:50%;box-shadow:inset 0 -8px 0 hsl(var(--h) 80% 86% / .5)}
.deco::before{width:46%;height:92%;left:14%;top:-46%}
.deco::after{width:34%;height:70%;left:50%;top:-30%}
:root[data-tema="laut"] .deco{height:var(--w);border-radius:50%;background:none;border:3px solid var(--deco)}
:root[data-tema="laut"] .deco::before,:root[data-tema="laut"] .deco::after{display:none}
:root[data-tema="hutan"] .deco{height:calc(var(--w)*.6);border-radius:0 100% 0 100%}
:root[data-tema="hutan"] .deco::before,:root[data-tema="hutan"] .deco::after{display:none}
:root[data-tema="senja"] .deco{height:var(--w);border-radius:0;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
:root[data-tema="senja"] .deco::before,:root[data-tema="senja"] .deco::after{display:none}
:root[data-tema="taman"] .deco{height:var(--w);border-radius:50%;box-shadow:0 0 0 calc(var(--w)*.18) var(--deco)}
:root[data-tema="taman"] .deco::before,:root[data-tema="taman"] .deco::after{display:none}
/* hiasan 3D kartun: bola mengilap dan bintang */
.orb{position:absolute;width:var(--w);aspect-ratio:1;left:var(--x);top:var(--y);border-radius:50%;
  background:radial-gradient(circle at 32% 26%,#fff 0 12%,hsl(var(--h) 100% 90%) 24%,hsl(var(--h) 85% 76%) 62%,hsl(var(--h) 70% 62%) 100%);
  box-shadow:inset -8px -10px 16px hsl(var(--h) 70% 45% / .28),0 14px 22px hsl(var(--h) 60% 45% / .18);animation:bob var(--d) ease-in-out infinite alternate}
.orb.o2{background:radial-gradient(circle at 32% 26%,#fff 0 12%,#ffe3ee 26%,var(--c1) 70%,color-mix(in srgb,var(--c1) 70%,#345) 100%)}
.orb.o3{background:radial-gradient(circle at 32% 26%,#fff 0 12%,#fff1cf 26%,var(--c2) 70%,color-mix(in srgb,var(--c2) 70%,#543) 100%)}
.orb.o4{background:radial-gradient(circle at 32% 26%,#fff 0 12%,#d9fff0 26%,var(--c3) 70%,color-mix(in srgb,var(--c3) 70%,#234) 100%)}
.star3d{position:absolute;width:var(--w);aspect-ratio:1;left:var(--x);top:var(--y);background:linear-gradient(145deg,#fff6c9,#ffd45c 60%,#f0b43c);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:twinkle var(--d) ease-in-out infinite alternate;filter:drop-shadow(0 4px 0 rgba(180,120,20,.25))}
@keyframes bob{from{transform:translateY(-14px) rotate(-3deg)}to{transform:translateY(18px) rotate(3deg)}}
@keyframes twinkle{from{transform:scale(.8) rotate(-12deg);opacity:.75}to{transform:scale(1.1) rotate(10deg);opacity:1}}
:root[data-theme="dark"] .orb,:root[data-theme="dark"] .star3d{opacity:.45}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .orb,:root:not([data-theme="light"]) .star3d{opacity:.45}}
@keyframes drift{from{transform:translateX(-24px) translateY(0)}to{transform:translateX(30px) translateY(10px)}}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 220px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,var(--cl2),var(--c2));border:3px solid var(--outline);box-shadow:0 4px 0 var(--outline);display:grid;place-items:center;flex:none;color:var(--outline)}
.logo svg{width:24px;height:24px}
.brand h1{font-size:1.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--ink2);font-weight:700;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand>div{min-width:0}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--outline);border-radius:999px;padding:4px 12px;font-weight:800;font-size:.85rem;box-shadow:0 3px 0 var(--outline);max-width:100%}
.pill .dot{width:9px;height:9px;border-radius:50%;background:var(--good);flex:none}
.pill.off .dot{background:var(--warn)}
.pill.live .dot{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;background:var(--surface);border:3px solid var(--outline);border-radius:14px;box-shadow:0 4px 0 var(--outline);cursor:pointer;transition:transform .08s,box-shadow .08s;padding:0;flex:none}
.icon-btn:hover{transform:translateY(-1px)}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--outline)}
.icon-btn.on{background:var(--c2);color:#2b1b00}

/* ---------- tombol & input ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:3px solid var(--outline);border-radius:16px;padding:.5em 1.1em;font:800 1rem var(--font-display);cursor:pointer;box-shadow:0 5px 0 var(--outline);transition:transform .08s,box-shadow .08s,filter .15s;text-align:center;min-height:44px;line-height:1.2}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--outline)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;filter:none}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.warm{background:var(--c2);color:#2b1b00}
.btn.pink{background:var(--c1);color:#3a0716}
.btn.mint{background:var(--c3);color:#06301f}
.btn.violet{background:var(--c4);color:#14093d}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:.25em .8em;font-size:.9rem;min-height:36px;border-width:2px;box-shadow:0 3px 0 var(--outline);border-radius:12px}
.btn.sm:active{transform:translateY(2px);box-shadow:0 1px 0 var(--outline)}
.btn.lg{font-size:1.2rem;padding:.6em 1.4em;min-height:54px}
.link-btn{background:none;border:0;padding:0;color:var(--accent);font-weight:800;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.field{display:grid;gap:6px}
.field>span,.lbl{font-weight:800;font-size:.9rem;color:var(--ink2)}
.in,select.in,textarea.in{width:100%;background:var(--surface);color:var(--ink);border:3px solid var(--outline);border-radius:14px;padding:.55em .8em;min-height:46px;box-shadow:inset 0 3px 0 var(--shadow)}
textarea.in{resize:vertical;min-height:96px;line-height:1.5}
.in::placeholder{color:var(--ink2);opacity:.75}
.in:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.err{color:var(--bad);font-weight:800;font-size:.9rem;min-height:1.2em}
.hint{color:var(--ink2);font-size:.9rem}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-weight:800;font-size:.78rem;background:var(--surface2);border:2px solid var(--line);color:var(--ink2)}
.chip.contoh{background:var(--c2);border-color:var(--outline);color:#2b1b00}
.chip.tg{background:var(--c3);color:#06301f;border-color:var(--outline)}
.chip.sd{background:var(--c2);color:#2b1b00;border-color:var(--outline)}
.chip.rd{background:var(--c1);color:#3a0716;border-color:var(--outline)}

/* ---------- panggung 3D ---------- */
main{flex:1;display:flex;flex-direction:column;min-width:0}
.hub{display:flex;flex-direction:column;align-items:center;gap:8px;padding-bottom:110px}
.stage{position:relative;width:100%;height:calc(var(--s)*2.05);perspective:1500px;perspective-origin:50% 38%;transition:height .9s var(--ease);margin-top:6px}
.stage.is-open{height:calc(var(--s)*2.55)}
.cam{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.box{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;animation:float 3.4s ease-in-out infinite}
@keyframes float{50%{transform:translateZ(calc(var(--s)*.07))}}
.shade{position:absolute;width:calc(var(--s)*1.9);height:calc(var(--s)*1.9);left:calc(var(--s)*-.95);top:calc(var(--s)*-.95);border-radius:50%;background:radial-gradient(circle,rgba(10,40,70,.38),transparent 62%);transform:translateZ(-3px)}
.stage.is-open .shade{background:radial-gradient(circle,rgba(10,40,70,.3),transparent 70%);width:calc(var(--s)*3.4);height:calc(var(--s)*3.4);left:calc(var(--s)*-1.7);top:calc(var(--s)*-1.7);transition:all .9s}
.base{position:absolute;width:var(--s);height:var(--s);left:calc(var(--s)/-2);top:calc(var(--s)/-2);transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:calc(var(--s)*.09);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
  border:max(3px,calc(var(--s)*.028)) solid var(--outline);
  background:linear-gradient(150deg,var(--cl,#cfeeff),var(--c,#7cccff));
  box-shadow:inset 0 calc(var(--s)*-.07) 0 rgba(0,0,0,.13),inset 0 calc(var(--s)*.03) 0 rgba(255,255,255,.55)}
.face::before{content:"";position:absolute;left:8%;top:5%;width:60%;height:18%;border-radius:999px;background:rgba(255,255,255,.34);transform:rotate(-8deg);pointer-events:none}
.face.plate{--cl:#e9f8ff;--c:#8fd6ff}
.plate .bot{position:absolute;left:50%;top:50%;width:62%;height:56%;transform:translate(-50%,-52%)}
.bot{border-radius:28%;background:linear-gradient(160deg,#fff,#dff3ff);border:max(3px,calc(var(--s)*.025)) solid var(--outline);display:flex;align-items:center;justify-content:center;gap:16%;box-shadow:0 calc(var(--s)*.03) 0 var(--outline)}
.bot::before{content:"";position:absolute;left:50%;top:calc(var(--s)*-.1);width:calc(var(--s)*.025);height:calc(var(--s)*.09);background:var(--outline);transform:translateX(-50%)}
.bot::after{content:"";position:absolute;left:50%;top:calc(var(--s)*-.15);width:calc(var(--s)*.075);height:calc(var(--s)*.075);background:var(--c1);border:max(2px,calc(var(--s)*.018)) solid var(--outline);border-radius:50%;transform:translateX(-50%);animation:blink 1.4s infinite}
.bot i{display:block;width:17%;height:34%;background:var(--outline);border-radius:50%;animation:eye 4.2s infinite;transform-origin:50% 50%}
.bot b{position:absolute;bottom:17%;left:50%;width:30%;height:14%;border-bottom:max(3px,calc(var(--s)*.025)) solid var(--outline);border-radius:0 0 999px 999px;transform:translateX(-50%)}
.bot s{position:absolute;bottom:26%;width:12%;height:9%;border-radius:50%;background:var(--c1);opacity:.7;text-decoration:none}
.bot s:nth-of-type(1){left:9%}.bot s:nth-of-type(2){right:9%}
@keyframes eye{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.hinge{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;transform:rotateZ(calc(var(--k)*90deg)) translateY(calc(var(--s)/-2))}
.wall{position:absolute;width:var(--s);height:var(--s);left:calc(var(--s)/-2);top:calc(var(--s)*-1);transform-origin:50% 100%;transform:rotateX(-90deg);transform-style:preserve-3d;
  transition:transform .95s var(--spring)}
.walls-open .wall{transform:rotateX(0deg);transition-delay:calc(var(--k)*.06s)}
.w1{--c:var(--c1);--cl:var(--cl1);--cd:var(--cd1)}.w2{--c:var(--c2);--cl:var(--cl2);--cd:var(--cd2)}
.w3{--c:var(--c3);--cl:var(--cl3);--cd:var(--cd3)}.w4{--c:var(--c4);--cl:var(--cl4);--cd:var(--cd4)}
.wall .outer{transform:rotateY(180deg)}
.fc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--s)*.045);padding:6%}
.inner .fc{transform:rotate(calc(var(--k)*-90deg))}
.fc svg{width:calc(var(--s)*.4);height:calc(var(--s)*.4);color:var(--outline);filter:drop-shadow(0 calc(var(--s)*.02) 0 rgba(255,255,255,.55))}
.fc .lab{background:#fff;color:#12324a;border:max(2px,calc(var(--s)*.02)) solid var(--outline);border-radius:999px;padding:.12em .7em;font:800 max(11px,calc(var(--s)*.108)) var(--font-display);white-space:nowrap;box-shadow:0 calc(var(--s)*.02) 0 var(--outline)}
.fc .no{position:absolute;left:7%;top:7%;width:calc(var(--s)*.2);height:calc(var(--s)*.2);border-radius:50%;background:#fff;border:max(2px,calc(var(--s)*.02)) solid var(--outline);display:grid;place-items:center;font:800 max(11px,calc(var(--s)*.12)) var(--font-display);color:#12324a}
.ready .inner{cursor:pointer;transition:transform .28s var(--spring),filter .2s}
.ready .inner:hover,.ready .inner:focus-visible{transform:translateZ(calc(var(--s)*.14));filter:brightness(1.07)}
.ready .inner.cur{filter:brightness(1.1) saturate(1.1)}
.ready .inner.cur::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 calc(var(--s)*.04) #fff}
.flap{position:absolute;left:0;bottom:100%;width:100%;height:50%;transform-origin:50% 100%;transform:rotateX(-90deg);transform-style:preserve-3d;transition:transform .8s var(--spring)}
.flap .f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;clip-path:polygon(0 100%,100% 100%,50% 0)}
.flap .f-out{transform:rotateY(180deg);background:linear-gradient(0deg,var(--cl),#fff 120%)}
.flap .f-in{background:var(--cd)}
.flaps-open .flap{transform:rotateX(72deg);transition-delay:calc(var(--k)*.08s)}
.walls-open .flap{transform:rotateX(180deg) translateZ(2px);visibility:hidden;transition:transform .7s var(--ease),visibility 0s .75s;transition-delay:0s,.75s!important}
.knob{position:absolute;left:calc(var(--s)*-.15);top:calc(var(--s)*-.15);width:calc(var(--s)*.3);height:calc(var(--s)*.3);border-radius:50%;
  transform:translateZ(calc(var(--s) + 3px));background:radial-gradient(circle at 36% 30%,#fff,#a8e4ff 42%,#2fa9ef);border:max(3px,calc(var(--s)*.025)) solid var(--outline);
  cursor:pointer;animation:glow 1.8s ease-in-out infinite;transition:transform .5s var(--spring)}
@keyframes glow{50%{box-shadow:0 0 0 calc(var(--s)*.06) rgba(255,255,255,.55),0 0 28px rgba(90,200,255,.95)}}
.flaps-open .knob,.walls-open .knob{transform:translateZ(calc(var(--s) + 3px)) scale(0);animation:none}
.stage.shake{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.burst{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:5}

/* kartu masuk */
.login{width:min(440px,100%);background:var(--surface);border:4px solid var(--outline);border-radius:28px;box-shadow:0 8px 0 var(--outline),0 26px 40px var(--shadow);padding:22px 22px 20px;display:grid;gap:14px;transition:opacity .45s,transform .6s var(--ease),max-height .7s var(--ease),padding .6s,margin .6s,border-width .6s;max-height:620px;overflow:hidden}

.login .row{display:grid;grid-template-columns:1fr 130px;gap:12px}
.greet{text-align:center;max-width:560px;display:grid;gap:4px;animation:rise .6s var(--ease)}
.greet h2{font-size:clamp(1.3rem,4vw,1.9rem)}
.greet p{color:var(--ink2)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--c2);color:#2b1b00;border:3px solid var(--outline);border-radius:18px;box-shadow:0 5px 0 var(--outline);padding:10px 14px;font-weight:800;animation:rise .4s var(--ease)}
.banner.info{background:var(--surface);color:var(--ink)}
.banner>span{min-width:0;flex:1 1 220px}

/* ---------- bilah tab ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabs[hidden]{display:none}
.tabs-in{pointer-events:auto;display:flex;gap:8px;background:var(--surface);border:4px solid var(--outline);border-radius:26px;padding:8px;box-shadow:0 6px 0 var(--outline),0 18px 30px var(--shadow);max-width:100%;overflow-x:auto}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;border:3px solid transparent;background:transparent;border-radius:18px;padding:6px 10px;cursor:pointer;font:800 .78rem var(--font-display);color:var(--ink2);min-width:64px;transition:transform .15s var(--spring),background .2s}
.tab svg{width:24px;height:24px}
.tab:hover{transform:translateY(-3px)}
.tab[aria-current="page"]{background:var(--tc,var(--accent));color:#10213a;border-color:var(--outline)}
.tab[aria-current="page"].t0{color:var(--accent-ink)}
.tab[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.tab.t1{--tc:var(--c1)}.tab.t2{--tc:var(--c2)}.tab.t3{--tc:var(--c3)}.tab.t4{--tc:var(--c4)}

/* ---------- panel ---------- */
.panel{animation:panelin .55s var(--spring);transform-origin:50% 0;padding-bottom:120px;display:grid;gap:16px;min-width:0}
@keyframes panelin{from{opacity:0;transform:perspective(900px) rotateX(18deg) translateY(30px) scale(.94)}}
.phead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(145deg,var(--pcl),var(--pc));color:#10213a;border:4px solid var(--outline);border-radius:26px;box-shadow:0 6px 0 var(--outline);padding:14px 18px;position:relative;overflow:hidden}

.phead .pi{width:56px;height:56px;border-radius:18px;background:#fff;border:3px solid var(--outline);display:grid;place-items:center;flex:none;color:var(--outline);box-shadow:0 4px 0 var(--outline)}

.phead h2{font-size:clamp(1.3rem,4.4vw,1.8rem);color:#10213a}
.phead p{font-weight:700;color:#1d3350}
.phead>div{min-width:0;flex:1 1 200px;position:relative;z-index:1}
.phead .btn{position:relative;z-index:1}
.card{background:var(--surface);border:3px solid var(--outline);border-radius:24px;box-shadow:0 5px 0 var(--outline),0 14px 24px var(--shadow);padding:18px;display:grid;gap:14px;min-width:0}

.card.teacher{background:var(--surface2);border-style:dashed}
.tag-teacher{display:inline-flex;gap:6px;align-items:center;font:800 .78rem var(--font-body);background:var(--outline);color:#fff;padding:2px 10px;border-radius:999px;width:fit-content}

.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.seg{display:flex;gap:6px;flex-wrap:wrap;background:var(--surface2);border:3px solid var(--outline);border-radius:18px;padding:5px;width:fit-content;max-width:100%}
.seg button{border:0;background:transparent;border-radius:12px;padding:.35em .9em;font:800 .95rem var(--font-display);cursor:pointer;color:var(--ink2);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 var(--outline)}
.seg button:disabled{opacity:.5;cursor:not-allowed}

/* perasaan */
.emo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

.emo{background:var(--surface2);border:3px solid var(--outline);border-radius:22px;padding:12px 4px 10px;display:grid;gap:2px;justify-items:center;cursor:pointer;box-shadow:0 5px 0 var(--outline);transition:transform .2s var(--spring),background .2s;min-width:0}
.emo .e{font-size:clamp(2.4rem,9vw,3.4rem);line-height:1.1;transition:transform .3s var(--spring)}
.emo .t{font:800 .92rem var(--font-display)}

.emo[aria-pressed="true"]{background:var(--c1);color:#3a0716;transform:translateY(-4px)}

.cnt{font-size:.8rem;color:var(--ink2);text-align:right}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:44px 1fr 34px;gap:8px;align-items:center}

.note-item{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 12px;display:grid;gap:2px}
.note-item b{font-size:.9rem}

/* materi */
.style-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}

.style{border:3px solid var(--outline);border-radius:22px;padding:14px 8px;display:grid;gap:6px;justify-items:center;text-align:center;cursor:pointer;box-shadow:0 5px 0 var(--outline);background:linear-gradient(150deg,var(--sl),var(--sc));color:#10213a;transition:transform .2s var(--spring)}
.style:hover{transform:translateY(-4px) rotate(-1deg)}
.style svg{width:46px;height:46px}
.style b{font:800 1.1rem var(--font-display)}
.style small{font-weight:700;line-height:1.3;color:#1d3350}
.style[aria-pressed="true"]{outline:4px solid var(--outline);outline-offset:3px;transform:translateY(-4px)}
.s-visual{--sl:var(--cl1);--sc:var(--c1)}.s-auditori{--sl:var(--cl2);--sc:var(--c2)}.s-audiovisual{--sl:var(--cl3);--sc:var(--c3)}.s-kinestetik{--sl:var(--cl4);--sc:var(--c4)}
.item{background:var(--surface);border:3px solid var(--outline);border-radius:20px;padding:14px;display:grid;gap:8px;align-content:start;box-shadow:0 4px 0 var(--outline);min-width:0}
.item h4{font-size:1.1rem;overflow-wrap:anywhere}
.item p{color:var(--ink2);font-size:.95rem;overflow-wrap:anywhere}
.item.shown{outline:4px solid var(--c2);outline-offset:3px}
.kind{display:flex;align-items:center;gap:6px;font-weight:800;font-size:.8rem;color:var(--ink2)}
.viewer{position:fixed;inset:0;z-index:70;background:rgba(5,25,45,.72);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .25s}
.viewer-in{background:var(--surface);border:4px solid var(--outline);border-radius:28px;box-shadow:0 8px 0 var(--outline);width:min(980px,100%);max-height:calc(100% - 8px);overflow:auto;padding:20px;display:grid;gap:14px;animation:panelin .5s var(--spring)}
.viewer-in .body{font-size:clamp(1.1rem,2.6vw,1.6rem);line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.viewer-in img,.viewer-in video{max-width:100%;max-height:60vh;border-radius:16px;margin-inline:auto;display:block;border:3px solid var(--outline)}
.viewer-in audio{width:100%}
@keyframes fade{from{opacity:0}}

/* asesmen */
.groups{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}
.team{border:3px solid var(--outline);border-radius:20px;background:var(--surface);box-shadow:0 4px 0 var(--outline);overflow:hidden;animation:rise .5s var(--spring) backwards;min-width:0}
.team header{background:var(--tc);color:#10213a;padding:8px 12px;font:800 1.05rem var(--font-display);display:flex;justify-content:space-between;gap:6px;border-bottom:3px solid var(--outline)}
.team ul{list-style:none;margin:0;padding:10px 12px;display:grid;gap:6px}
.team li{display:flex;gap:8px;align-items:center;justify-content:space-between;font-weight:700;min-width:0}
.team li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team.me{outline:4px solid var(--c2);outline-offset:3px}
.tc0{--tc:var(--c1)}.tc1{--tc:var(--c2)}.tc2{--tc:var(--c3)}.tc3{--tc:var(--c4)}.tc4{--tc:var(--cl1)}.tc5{--tc:var(--cl2)}.tc6{--tc:var(--cl3)}.tc7{--tc:var(--cl4)}
.gcard{display:grid;gap:8px;border:3px solid var(--outline);border-radius:22px;padding:16px;background:linear-gradient(150deg,var(--gl),var(--gc));color:#10213a;cursor:pointer;text-align:left;box-shadow:0 5px 0 var(--outline);transition:transform .2s var(--spring);min-width:0}
.gcard:hover{transform:translateY(-4px) rotate(-.6deg)}
.gcard h4{font-size:1.2rem;color:#10213a}.gcard p{color:#1d3350;font-weight:700;font-size:.92rem}
.gcard svg{width:40px;height:40px}
.g1{--gl:var(--cl1);--gc:var(--c1)}.g2{--gl:var(--cl2);--gc:var(--c2)}.g3{--gl:var(--cl3);--gc:var(--c3)}.g4{--gl:var(--cl4);--gc:var(--c4)}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.step{background:var(--surface2);border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-weight:800;font-size:.85rem;display:flex;gap:8px;align-items:center}
.step b{background:var(--accent);color:var(--accent-ink);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:.8rem}
.qcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.qcard{aspect-ratio:3/4;perspective:600px;border:0;background:none;padding:0;cursor:pointer}
.qcard .in3{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s var(--spring)}
.qcard .fr,.qcard .bk{position:absolute;inset:0;border-radius:16px;border:3px solid var(--outline);display:grid;place-items:center;backface-visibility:hidden;font:800 1.7rem var(--font-display)}
.qcard .fr{background:linear-gradient(150deg,var(--cl4),var(--c4));color:#10213a;box-shadow:0 4px 0 var(--outline)}
.qcard .bk{transform:rotateY(180deg);background:var(--surface2);font-size:1rem}
.qcard:hover .in3{transform:rotateY(-14deg) translateY(-4px)}
.qcard.used .in3{transform:rotateY(180deg)}
.qcard:disabled{cursor:default;opacity:.8}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;background:var(--surface);border:3px solid var(--outline);border-radius:16px;padding:10px 14px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--outline);min-height:50px;transition:transform .1s}
.opt b{background:var(--c4);color:#10213a;border-radius:10px;width:30px;height:30px;display:grid;place-items:center;flex:none;font-family:var(--font-display)}
.opt:hover{transform:translateY(-2px)}
.opt.ok{background:var(--good);color:#fff;animation:bounce2 .5s}
.opt.no{background:var(--bad);color:#fff;animation:shake .4s}
.opt.ok b,.opt.no b{background:#fff;color:#10213a}
@keyframes bounce2{50%{transform:scale(1.04)}}
.timer{height:12px;border-radius:999px;background:var(--surface2);border:2px solid var(--outline);overflow:hidden}
.timer i{display:block;height:100%;background:var(--c3);width:100%;transform-origin:left;transition:background .3s}
.qbox{font:800 clamp(1.2rem,3.4vw,1.8rem) var(--font-display);line-height:1.3;overflow-wrap:anywhere}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.mc{aspect-ratio:1/1.05;perspective:700px;border:0;background:none;padding:0;cursor:pointer;min-width:0}
.mc .in3{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s var(--spring)}
.mc .fr,.mc .bk{position:absolute;inset:0;border-radius:16px;border:3px solid var(--outline);backface-visibility:hidden;display:grid;place-items:center;padding:6px;text-align:center}
.mc .fr{background:linear-gradient(150deg,var(--cl3),var(--c3));box-shadow:0 4px 0 var(--outline);color:var(--outline)}
.mc .fr svg{width:40%;height:40%}
.mc .bk{transform:rotateY(180deg);background:var(--surface);font-weight:800;font-size:clamp(.72rem,2.6vw,.95rem);line-height:1.25;overflow:hidden;overflow-wrap:anywhere}
.mc.up .in3{transform:rotateY(180deg)}

.wheel-wrap{display:grid;justify-items:center;gap:12px}

.result{font:800 clamp(1.4rem,5vw,2.2rem) var(--font-display);text-align:center;min-height:1.3em;animation:rise .4s var(--spring)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;min-height:190px;padding-top:10px}

.pod{display:grid;gap:4px;justify-items:center;flex:1 1 0;max-width:150px;min-width:0}

.pod .blk{width:100%;border:3px solid var(--outline);border-bottom:0;border-radius:16px 16px 0 0;background:linear-gradient(180deg,var(--cl2),var(--c2));display:grid;place-items:start center;padding-top:8px;font:800 1.6rem var(--font-display);color:#10213a;height:0;transition:height 1s var(--ease)}

.score-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:2px solid var(--line);border-radius:16px;padding:8px 12px;background:var(--surface)}

.table-card{border:3px solid var(--outline);border-radius:18px;padding:12px;background:var(--surface);display:grid;gap:8px}
.table-card .pl{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.table-card select{min-height:38px;padding:.2em .6em;width:84px}
.medal{font:800 .78rem var(--font-body);border-radius:999px;padding:1px 10px;border:2px solid var(--outline);background:var(--c2);color:#2b1b00}

/* exit ticket */
.q{display:grid;gap:10px;background:var(--surface2);border:3px solid var(--outline);border-radius:20px;padding:14px;box-shadow:0 4px 0 var(--outline)}
.q h4{font-size:1.1rem;overflow-wrap:anywhere}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale button{font-size:clamp(1.6rem,7vw,2.3rem);background:var(--surface);border:3px solid var(--outline);border-radius:16px;padding:6px 0;cursor:pointer;display:grid;gap:0;justify-items:center;box-shadow:0 4px 0 var(--outline);transition:transform .15s var(--spring)}

/* tabel guru */
.tbl-wrap{overflow-x:auto;border:3px solid var(--outline);border-radius:18px;background:var(--surface)}

th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:2px solid var(--line)}

/* modal */
.modal{position:fixed;inset:0;z-index:80;background:rgba(5,25,45,.6);backdrop-filter:blur(5px);display:grid;place-items:center;padding:12px;animation:fade .2s}
.modal-in{background:var(--surface);border:4px solid var(--outline);border-radius:28px;box-shadow:0 8px 0 var(--outline);width:min(760px,100%);max-height:calc(100% - 8px);overflow:auto;padding:20px;display:grid;gap:14px;animation:panelin .45s var(--spring);min-width:0}

.modal-in>header{display:flex;justify-content:space-between;gap:10px;align-items:center}

.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{border:3px solid var(--outline);border-radius:16px;padding:8px 12px;font-weight:800;cursor:pointer;background:var(--surface);display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 var(--outline)}
.sw i{display:block;width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--a),var(--b),var(--c),var(--d),var(--a));border:2px solid var(--outline)}
.sw[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);transform:translateY(-3px)}

.toast{background:var(--outline);color:#fff;border-radius:16px;padding:10px 16px;font-weight:800;box-shadow:0 8px 20px var(--shadow);animation:rise .3s var(--spring);max-width:min(520px,100%)}
:root[data-theme="dark"] .toast{background:var(--ink);color:var(--bg1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast{background:var(--ink);color:var(--bg1)}}
.empty{display:grid;gap:6px;justify-items:center;text-align:center;padding:22px 12px;color:var(--ink2);border:3px dashed var(--line);border-radius:20px}

}

.thumb.big{max-height:60vh;object-fit:contain;max-width:min(100%,900px)}
.thumb{width:100%;max-height:160px;object-fit:cover;border-radius:12px;border:3px solid var(--outline);background:var(--surface2)}
/* ---------- pemutar musik ---------- */
.music-fab{position:fixed;left:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:45;width:58px;height:58px;border-radius:50%;border:4px solid var(--outline);background:radial-gradient(circle at 34% 28%,#fff,hsl(var(--h) 90% 82%) 55%,hsl(var(--h) 75% 68%));box-shadow:0 6px 0 var(--outline),0 14px 22px var(--shadow);display:grid;place-items:center;cursor:pointer;color:var(--outline);padding:0;transition:transform .15s var(--spring)}
.music-fab:hover{transform:translateY(-3px) scale(1.05)}
.music-fab:active{transform:translateY(3px);box-shadow:0 2px 0 var(--outline)}
.music-fab svg{width:26px;height:26px}
.music-fab .eq{display:none;gap:3px;align-items:flex-end;height:24px}
.music-fab .eq i{display:block;width:5px;border-radius:3px;background:var(--outline);animation:eq .9s ease-in-out infinite alternate}
.music-fab .eq i:nth-child(2){animation-delay:.2s}.music-fab .eq i:nth-child(3){animation-delay:.4s}.music-fab .eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{from{height:5px}to{height:24px}}
.music-fab.playing svg{display:none}.music-fab.playing .eq{display:flex}
.music-pop{position:fixed;left:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:46;width:min(350px,calc(100vw - 32px));background:var(--surface);border:4px solid var(--outline);border-radius:26px;box-shadow:0 8px 0 var(--outline),0 22px 36px var(--shadow);padding:16px;display:grid;gap:12px;animation:panelin .4s var(--spring);transform-origin:0 100%}
.music-pop h3{font-size:1.2rem}
.trk{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface2);border:3px solid var(--outline);border-radius:16px;padding:8px 12px;cursor:pointer;box-shadow:0 4px 0 var(--outline);transition:transform .12s var(--spring);min-height:52px}
.trk:hover{transform:translateY(-2px)}
.trk .dot{width:34px;height:34px;border-radius:50%;background:var(--tc);border:3px solid var(--outline);display:grid;place-items:center;flex:none;color:#10213a}
.trk .dot svg{width:18px;height:18px}
.trk b{font:800 1rem var(--font-display);display:block;line-height:1.1}
.trk small{color:var(--ink2);font-weight:700}
.trk[aria-pressed="true"]{background:var(--tc);color:#10213a}
.trk[aria-pressed="true"] small{color:#1d3350}
.trk[aria-pressed="true"] .dot{background:#fff}
.t-piano{--tc:var(--c1)}.t-kotak{--tc:var(--c2)}.t-gamelan{--tc:var(--c3)}.t-seruling{--tc:var(--c4)}.t-gitar{--tc:var(--cl1)}
.vol{display:flex;align-items:center;gap:10px;font-weight:800}
.vol input{flex:1;accent-color:var(--accent);min-width:0;height:28px}
@media(max-width:640px){.music-fab{bottom:calc(108px + env(safe-area-inset-bottom,0px))}.music-pop{bottom:calc(180px + env(safe-area-inset-bottom,0px))}}
.score-row.mine{outline:3px solid var(--c2);outline-offset:2px}

<script>
(function(){'use strict';
/* ================= paket isi: Teks Prosedur Kompleks (Bahasa Indonesia, Fase E / kelas X) ================= */
const T_KOMPOS='CARA MEMBUAT KOMPOS RUMAHAN\n\nTujuan\nKompos dibuat untuk mengubah sisa sayur dan daun menjadi pupuk alami sehingga sampah rumah tangga berkurang.\n\nBahan dan alat\n• 2 kg sisa sayur dan buah (tanpa daging dan minyak)\n• 1 kg daun kering atau serutan kayu\n• 1 gelas tanah kebun\n• 1 ember bertutup berukuran 20 liter\n• Pisau, sarung tangan, dan pengaduk kayu\n\nLangkah-langkah\n1. Siapkan wadah.\n   a. Lubangi dasar dan sisi ember dengan paku agar udara dapat masuk (aerasi).\n   b. Alasi dasar ember dengan ranting kecil setebal 3 cm agar air tidak menggenang.\n2. Cacah bahan.\n   a. Potong sisa sayur dan buah sebesar 2 cm supaya lebih cepat terurai.\n   b. Jika bahan terlalu basah, campurkan dengan daun kering terlebih dahulu.\n3. Susun lapisan.\n   a. Masukkan lapisan sisa sayur setebal 5 cm.\n   b. Tutup dengan lapisan daun kering dan taburi segenggam tanah.\n   c. Ulangi sampai ember terisi tiga perempat bagian.\n4. Rawat kompos.\n   a. Aduk campuran setiap tiga hari agar proses dekomposisi merata.\n   b. Percikkan air apabila campuran terlalu kering. Kelembapan yang tepat adalah seperti spons yang diperas.\n   c. Apabila muncul bau menyengat, tambahkan daun kering lalu aduk kembali.\n5. Panen kompos.\n   a. Setelah 4 sampai 6 minggu, periksa warna dan bau. Kompos matang berwarna cokelat gelap dan berbau tanah.\n   b. Ayak kompos, lalu simpan dalam karung berlubang.\n\nCatatan\nGunakan sarung tangan selama bekerja dan cuci tangan setelahnya. Jangan memasukkan daging, tulang, atau minyak karena menimbulkan bau dan mengundang lalat.';
const T_APAR='CARA MENGGUNAKAN ALAT PEMADAM API RINGAN (APAR)\n\nTujuan\nMemadamkan api kecil dengan cepat dan aman sebelum api membesar.\n\nAlat\n• APAR berisi bubuk kimia kering (ukuran 3 kg)\n\nLangkah-langkah\n1. Periksa kesiapan alat.\n   a. Pastikan jarum penunjuk tekanan berada di zona hijau.\n   b. Pastikan selang dan nozzle tidak retak atau tersumbat.\n2. Ambil posisi.\n   a. Berdirilah pada jarak 2 sampai 3 meter dari api.\n   b. Posisikan punggungmu searah dengan arah angin agar asap dan api tidak mengarah kepadamu.\n3. Tarik pin pengaman pada gagang tuas.\n4. Arahkan nozzle ke pangkal api, bukan ke nyala api, karena pangkal api adalah sumber bahan bakar yang terbakar.\n5. Tekan tuas dengan kuat, lalu sapukan semburan ke kiri dan ke kanan.\n6. Pantau api.\n   a. Jika api padam, tetap awasi selama beberapa menit karena api dapat menyala kembali.\n   b. Jika api membesar atau tidak padam dalam 10 sampai 15 detik, hentikan dan segera tinggalkan ruangan.\n\nCatatan\nJangan memaksakan diri memadamkan api yang sudah besar. Keselamatan diri lebih penting daripada menyelamatkan barang. Laporkan pemakaian APAR kepada petugas agar tabung segera diisi ulang.';
const T_BAN_A='TEKS A\nCARA MENGGANTI BAN DALAM SEPEDA\n\nTujuan\nMengganti ban dalam yang bocor agar sepeda dapat dipakai dengan aman.\n\nAlat dan bahan\n• 1 ban dalam baru sesuai ukuran\n• 2 tuas pelepas ban\n• Kunci pas ukuran 15 mm\n• Pompa sepeda\n\nLangkah-langkah\n1. Lepaskan roda.\n   a. Balikkan sepeda hingga bertumpu pada setang dan sadel.\n   b. Kendurkan mur roda dengan kunci pas, lalu tarik roda keluar.\n2. Keluarkan ban dalam.\n   a. Kempiskan sisa udara melalui katup.\n   b. Selipkan tuas ban di antara ban luar dan velg, lalu ungkit ke arah luar sampai ban luar terlepas pada satu sisi.\n   c. Tarik ban dalam keluar.\n3. Periksa ban luar.\n   a. Raba bagian dalam ban luar dengan jari untuk mencari paku atau kerikil.\n   b. Cabut benda tajam yang ditemukan karena dapat melubangi ban dalam baru.\n4. Pasang ban dalam baru.\n   a. Pompa sedikit ban dalam baru agar berbentuk.\n   b. Masukkan katup ke lubang velg, lalu selipkan ban dalam ke dalam ban luar.\n5. Kembalikan ban luar ke velg dengan tangan. Jika terasa keras, gunakan tuas ban.\n6. Pasang roda, kencangkan mur, lalu pompa ban sampai keras.\n\nCatatan\nPastikan ban dalam tidak terjepit antara velg dan ban luar.';
const T_BAN_B='TEKS B\nGANTI BAN DALAM\n\nLepas roda sepeda, keluarkan ban lama, pasang yang baru, pompa, lalu pasang lagi rodanya. Hati-hati agar tidak terjepit. Selesai.';
const TPK_PAKET={
  pv:3,
  judul:'SMART BOX',mapel:'Bahasa Indonesia',topik:'Teks Prosedur Kompleks',tema:'hutan',kelas:['X-1','X-2'],
  sesi:{id:'p1',label:'Pertemuan 1'},timer:45,
  tp:[
    'Murid mampu mengungkapkan kembali informasi eksplisit dari teks prosedur kompleks yang disimak dengan mengidentifikasi tujuan, alat dan bahan, serta langkah-langkah teks prosedur kompleks secara tepat.',
    'Murid mampu mengidentifikasi akurasi informasi dan hubungan sebab-akibat dalam teks prosedur kompleks yang disimak.',
    'Murid mampu menanggapi isi teks prosedur kompleks secara kritis berdasarkan informasi yang diperoleh.',
    'Murid mampu menginterpretasi makna tersurat dan tersirat dalam teks prosedur kompleks yang dibaca.',
    'Murid mampu memahami serta melakukan instruksi dalam teks prosedur secara tepat dan runtut.',
    'Murid mampu membandingkan dua teks prosedur kompleks berdasarkan isi, struktur, dan kejelasan langkah.'
  ],
  materi:[
    /* VISUAL */
    {id:'t1',cat:'visual',kind:'text',title:'Peta struktur teks prosedur kompleks (TP 1)',desc:'Pelajari bagian-bagiannya, lalu cocokkan dengan teks contoh.',body:'STRUKTUR TEKS PROSEDUR KOMPLEKS\n\n[ 1. TUJUAN ]\n   Menyebut apa yang akan dibuat atau dicapai.\n        ↓\n[ 2. ALAT DAN BAHAN ]\n   Daftar kebutuhan lengkap dengan jumlah atau ukuran.\n        ↓\n[ 3. LANGKAH-LANGKAH ]\n   Berurutan. Satu langkah dapat memiliki sub-langkah (a, b, c), percabangan "jika ... maka ...", dan alasan.\n        ↓\n[ 4. CATATAN / PENUTUP ]\n   Peringatan keselamatan, hasil yang diharapkan, atau cara menyimpan.\n\nCARA CEPAT MENEMUKAN INFORMASI EKSPLISIT\n• Tujuan: cari kalimat setelah judul "Tujuan" atau kata "untuk", "agar".\n• Alat dan bahan: cari daftar bertitik atau bernomor dengan jumlah.\n• Langkah: cari kalimat perintah dan penanda urutan.'},
    {id:'t2',cat:'visual',kind:'text',title:'Diagram sebab-akibat dan akurasi informasi (TP 2)',desc:'Lihat alasan di balik setiap langkah, lalu uji kebenarannya.',body:'POLA SEBAB-AKIBAT DALAM PROSEDUR\n\n  TINDAKAN                    →  ALASAN (SEBAB)                       →  AKIBAT JIKA DILANGGAR\n  Lubangi ember               →  agar udara masuk (aerasi)            →  kompos membusuk dan berbau\n  Cacah sayur 2 cm            →  supaya cepat terurai                  →  proses lama\n  Nozzle ke pangkal api       →  pangkal api adalah sumber bahan bakar →  api tidak padam\n  Periksa ban luar            →  benda tajam dapat melubangi ban baru  →  ban baru cepat bocor\n\nPENANDA SEBAB-AKIBAT\nkarena, sebab, agar, supaya, sehingga, akibatnya, oleh karena itu.\n\nMENGUJI AKURASI INFORMASI\n1. Cocokkan angka dan satuan (3 cm bukan 3 m).\n2. Cocokkan urutan (apakah langkah A memang sebelum B?).\n3. Cari kata mutlak yang mencurigakan (selalu, tidak pernah, pasti).\n4. Tanyakan: apakah alasan dalam teks masuk akal?'},
    {id:'t3',cat:'visual',kind:'text',title:'Tabel pembanding dua teks prosedur (TP 6)',desc:'Gunakan sebagai kerangka saat membandingkan Teks A dan Teks B.',body:'ASPEK | TEKS A | TEKS B\nIsi: tujuan | ... | ...\nIsi: alat dan bahan | ... | ...\nIsi: jumlah langkah dan sub-langkah | ... | ...\nStruktur: bagian lengkap? | ... | ...\nKejelasan: urutan runtut? | ... | ...\nKejelasan: angka, ukuran, alasan | ... | ...\nSimpulan: cocok untuk siapa? | ... | ...\n\nCONTOH PENGISIAN (Teks A dan B "Mengganti Ban Dalam", lihat Bahan Ajar):\n• Teks A memuat tujuan, daftar alat, 6 langkah dengan sub-langkah, dan catatan. Teks B hanya satu paragraf tanpa tujuan dan alat.\n• Teks A menjelaskan alasan (benda tajam dapat melubangi ban). Teks B hanya memberi peringatan umum.\n• Simpulan: A cocok untuk pemula, B cocok sebagai pengingat bagi yang sudah mahir.'},
    /* AUDITORI */
    {id:'t4',cat:'auditori',kind:'text',title:'Naskah simak: Cara Menggunakan APAR (TP 1 dan 2)',desc:'Guru atau teman membacakan. Pendengar menutup layar, mencatat, lalu mengungkapkan kembali.',body:'CARA KERJA\n1. Satu murid (pembaca) membacakan naskah dengan jelas dan tidak terlalu cepat. Pendengar tidak melihat teks.\n2. Pendengar mencatat: (a) tujuan, (b) alat, (c) langkah berurutan.\n3. Setelah dibacakan, pendengar mengungkapkan kembali informasi tersebut dengan kata-katanya sendiri.\n4. Buka teks aslinya (di Bahan Ajar atau Game Telaah Teks) dan cocokkan.\n\nNASKAH (dibacakan)\n"Tujuan prosedur ini adalah memadamkan api kecil dengan cepat dan aman. Alat yang dipakai adalah satu APAR bubuk kimia kering berukuran tiga kilogram. Pertama, periksa kesiapan alat: pastikan jarum tekanan berada di zona hijau dan nozzle tidak tersumbat. Kedua, berdirilah dua sampai tiga meter dari api dengan punggung searah angin. Ketiga, tarik pin pengaman. Keempat, arahkan nozzle ke pangkal api, bukan ke nyala api, karena pangkal api adalah sumber bahan bakarnya. Kelima, tekan tuas lalu sapukan ke kiri dan ke kanan. Keenam, pantau api. Jika api membesar atau tidak padam dalam sepuluh sampai lima belas detik, hentikan dan segera tinggalkan ruangan."\n\nPERTANYAAN SIMAK\n1. Apa tujuan prosedur ini?\n2. Alat apa yang dibutuhkan?\n3. Sebutkan enam langkah secara berurutan.\n4. Mengapa nozzle diarahkan ke pangkal api?\n5. Berapa jarak aman berdiri dari api?'},
    {id:'t5',cat:'auditori',kind:'text',title:'Diskusi lisan: tanggapan kritis dan makna tersirat (TP 3 dan 4)',desc:'Berdiskusi berpasangan lalu berbagi ke kelas.',body:'Setelah menyimak naskah APAR, diskusikan secara lisan:\n\nMAKNA TERSURAT (tertulis jelas)\n• Apa yang dilakukan jika api membesar? (jawaban ada di teks)\n\nMAKNA TERSIRAT (disimpulkan)\n• Kalimat "Keselamatan diri lebih penting daripada menyelamatkan barang" menyiratkan apa tentang cara mengambil keputusan saat darurat?\n• Mengapa teks menyuruh memeriksa jarum tekanan lebih dulu? Apa yang tersirat tentang pentingnya perawatan alat?\n\nTANGGAPAN KRITIS\n• Apakah langkah dalam teks sudah cukup lengkap? Informasi apa yang masih kurang (mis. jenis api yang boleh dipadamkan)?\n• Jika kamu menemukan jarum APAR berada di zona merah, apa tanggapanmu?\n\nGunakan kalimat: "Menurut saya ... karena di teks disebutkan bahwa ...".'},
    /* AUDIOVISUAL */
    {id:'t6',cat:'audiovisual',kind:'url',title:'Video 1: contoh prosedur kompleks (tempel tautan)',desc:'Tempel tautan video prosedur (mis. menggunakan APAR atau mengganti ban dalam). Saat menonton, isi lembar simak: tujuan, alat dan bahan, langkah.',url:'https://www.youtube.com'},
    {id:'t7',cat:'audiovisual',kind:'text',title:'Lembar simak video (TP 1, 2, 5)',desc:'Cetak atau salin ke buku, isi saat menonton video.',body:'LEMBAR SIMAK\nJudul video: ..................\n\nA. INFORMASI EKSPLISIT\n1. Tujuan prosedur: ..................\n2. Alat dan bahan: ..................\n3. Langkah-langkah (tulis dengan kalimat perintah):\n   1) ..................\n   2) ..................\n   3) ..................\n\nB. AKURASI DAN SEBAB-AKIBAT\n1. Satu informasi dalam video yang menurutmu akurat, dan alasannya: ..................\n2. Satu hubungan sebab-akibat yang disebut dalam video: "..... karena ....."\n\nC. TANGGAPAN KRITIS\n1. Bagian video yang kurang jelas dan saranmu: ..................\n\nD. LAKUKAN\nCoba lakukan satu langkah pendek dari video, lalu ceritakan hasilnya.'},
    /* KINESTETIK */
    {id:'t8',cat:'kinestetik',kind:'text',title:'Praktik: robot dan pemberi instruksi (TP 5)',desc:'Berpasangan, sekitar 15 menit. Melatih memahami dan melakukan instruksi secara runtut.',body:'Alat: selembar kertas HVS, gunting, lem atau selotip, spidol.\n\nPERAN\n• Pemberi instruksi: membacakan teks prosedur (mis. melipat kapal kertas atau membuat amplop).\n• Robot: melakukan persis sesuai kalimat yang dibacakan, tanpa menebak.\n\nLANGKAH\n1. Pemberi instruksi menulis 8 sampai 10 langkah dengan kalimat perintah dan ukuran jelas (mis. lipat sisi kiri sejauh 3 cm).\n2. Robot melakukan hanya sesuai teks. Jika langkah tidak jelas, robot berhenti.\n3. Catat langkah yang membuat robot bingung.\n4. Perbaiki langkah itu (tambahkan ukuran, urutan, atau alasan).\n5. Tukar peran.\n\nREFLEKSI\n• Langkah mana yang paling sering membuat robot salah?\n• Perbaikan apa yang membuat instruksi lebih runtut?'},
    {id:'t9',cat:'kinestetik',kind:'text',title:'Susun kartu langkah dan berdiri jika benar (TP 2 dan 5)',desc:'Aktivitas kelompok dan permainan gerak.',body:'A. SUSUN KARTU LANGKAH (kelompok, 10 menit)\n1. Guru membagikan satu set kartu langkah "Cara Membuat Kompos Rumahan" yang diacak.\n2. Susun menjadi urutan yang benar di kertas manila.\n3. Beri warna merah pada kalimat perintah dan biru pada penanda urutan.\n4. Tambahkan satu kartu alasan (sebab) untuk satu langkah.\n\nB. BERDIRI JIKA BENAR (seluruh kelas, 10 menit)\n1. Guru membacakan pernyataan tentang teks.\n2. Jika pernyataan akurat: berdiri. Jika tidak akurat: duduk dan sebutkan bagian teks yang benar.\n3. Contoh pernyataan: "Kompos diaduk setiap tiga hari." (berdiri) / "Daging boleh dimasukkan ke kompos." (duduk).\n\nC. PRAKTIK\nPeragakan satu prosedur sederhana (mis. cuci tangan enam langkah) sambil temanmu membacakan langkahnya.'},

    {id:'t10',cat:'media',kind:'url',title:'Contoh media ajar: PPT atau Canva',desc:'Tempel tautan PPT, Canva, atau Google Slides tentang teks prosedur kompleks. Tombol Tampilkan akan membukanya untuk kelas.',url:'https://www.canva.com'},
    {id:'t11',cat:'media',kind:'text',title:'Kerangka slide pembelajaran',desc:'Urutan tayangan yang dapat dipakai guru.',body:'SLIDE 1  Tujuan pembelajaran (6 TP)\nSLIDE 2  Pemantik: "Apa yang terjadi bila instruksi tidak runtut?"\nSLIDE 3  Struktur teks prosedur kompleks (tujuan, alat dan bahan, langkah, catatan)\nSLIDE 4  Simak naskah APAR dan ungkapkan kembali (TP 1)\nSLIDE 5  Akurasi informasi dan sebab-akibat (TP 2)\nSLIDE 6  Makna tersurat dan tersirat (TP 4)\nSLIDE 7  Tanggapan kritis (TP 3)\nSLIDE 8  Praktik robot dan instruksi (TP 5)\nSLIDE 9  Membandingkan Teks A dan B (TP 6)\nSLIDE 10 Asesmen: Smartbox games dan Exit Ticket'},

    {id:'t12',cat:'bahan',kind:'text',title:'Teks 1: Cara Membuat Kompos Rumahan',desc:'Teks utama untuk dibaca, ditandai, dan diuji akurasinya.',body:T_KOMPOS},
    {id:'t13',cat:'bahan',kind:'text',title:'Teks 2: Cara Menggunakan APAR',desc:'Teks untuk tersurat, tersirat, dan tanggapan kritis.',body:T_APAR},
    {id:'t14',cat:'bahan',kind:'text',title:'Teks A dan B: Mengganti Ban Dalam Sepeda',desc:'Dua teks untuk dibandingkan berdasarkan isi, struktur, dan kejelasan langkah.',body:T_BAN_A+'\n\n──────────\n\n'+T_BAN_B},
    {id:'t15',cat:'bahan',kind:'text',title:'Ringkasan: makna tersurat dan tersirat serta ciri kebahasaan',desc:'Rangkuman untuk dicatat.',body:'MAKNA TERSURAT\nInformasi yang ditulis langsung, dapat ditunjuk pada kalimat tertentu. Contoh: "Aduk campuran setiap tiga hari."\n\nMAKNA TERSIRAT\nPesan yang disimpulkan dari teks, tidak ditulis langsung. Contoh: "Jangan memaksakan diri memadamkan api yang sudah besar" menyiratkan bahwa keselamatan lebih penting daripada barang.\n\nCARA MENEMUKAN MAKNA TERSIRAT\n1. Baca catatan, peringatan, dan alasan.\n2. Tanyakan: mengapa penulis menyertakan bagian ini?\n3. Simpulkan dengan kalimatmu, lalu cari bukti di teks.\n\nCIRI KEBAHASAAN\n• Kalimat perintah: siapkan, tarik, aduk.\n• Konjungsi temporal: pertama, kemudian, setelah itu, sebelum, selama.\n• Konjungsi syarat: jika, apabila.\n• Konjungsi sebab: karena, agar, supaya, sehingga.\n• Istilah khusus: aerasi, dekomposisi, nozzle.'},
    {id:'t16',cat:'bahan',kind:'text',title:'Rubrik penilaian',desc:'Panduan menilai unjuk kerja untuk keenam tujuan pembelajaran.',body:'Skor 1 sampai 4 pada setiap indikator.\n\nTP 1  Mengungkapkan kembali tujuan, alat dan bahan, serta langkah dengan tepat\nTP 2  Menunjukkan informasi yang akurat dan hubungan sebab-akibat\nTP 3  Memberi tanggapan kritis dengan alasan dari teks\nTP 4  Menjelaskan makna tersurat dan tersirat disertai bukti\nTP 5  Melakukan instruksi secara tepat dan runtut\nTP 6  Membandingkan dua teks (isi, struktur, kejelasan) dengan simpulan\n\nNilai = jumlah skor ÷ 24 × 100'}

const T_LUKA=`CARA MENANGANI LUKA BAKAR RINGAN DI RUMAH

Tujuan
Mengurangi rasa sakit dan mencegah kerusakan kulit semakin dalam serta infeksi pada luka bakar ringan (kulit memerah, nyeri, tanpa lepuh besar).

Alat dan bahan
• Air mengalir yang bersih dan sejuk (bukan air es)
• Kasa steril yang tidak lengket
• Perban atau plester
• Sabun ringan

Langkah-langkah
1. Hentikan sumber panas.
   a. Jauhkan korban dari api, air panas, atau benda panas.
   b. Lepaskan cincin, gelang, atau pakaian yang tidak menempel agar tidak terjepit saat kulit membengkak.
2. Dinginkan luka.
   a. Alirkan air sejuk pada luka selama 10 sampai 20 menit sehingga panas di dalam kulit turun.
   b. Jangan memakai air es karena dapat merusak jaringan kulit lebih parah.
3. Bersihkan dengan lembut.
   a. Cuci sekitar luka dengan sabun ringan dan air mengalir.
   b. Jangan memecahkan lepuh agar luka tidak mudah terinfeksi.
4. Tutup luka.
   a. Tutup dengan kasa steril yang tidak lengket.
   b. Rekatkan perban secara longgar supaya tidak menekan kulit.
5. Pantau kondisi luka.
   a. Ganti penutup setiap hari atau bila basah.
   b. Segera bawa ke tenaga kesehatan bila luka lebih besar dari telapak tangan korban, berada di wajah atau sendi, atau tampak putih kehitaman.

Catatan
Jangan mengoleskan pasta gigi, mentega, atau kecap karena menahan panas dan memicu infeksi.`;
const T_TEMPE=`CARA MEMBUAT TEMPE KEDELAI RUMAHAN

Tujuan
Mengolah kedelai menjadi tempe melalui peragian agar menjadi makanan bergizi yang tahan beberapa hari.

Alat dan bahan
• 500 g kedelai kering
• 1 sendok teh ragi tempe (sekitar 2 g)
• Panci besar, saringan, dan baskom
• Daun pisang atau plastik yang dilubangi kecil-kecil
• Kain bersih

Langkah-langkah
1. Siapkan kedelai.
   a. Cuci kedelai sampai bersih lalu rebus selama 30 menit.
   b. Rendam dalam air rebusan selama 12 jam sampai kulitnya mudah terkelupas, sebab proses ini melunakkan biji dan membuat ragi mudah tumbuh.
2. Kupas dan masak ulang.
   a. Remas kedelai dan buang kulit arinya.
   b. Rebus lagi 30 menit sampai empuk, kemudian tiriskan.
3. Keringkan dan dinginkan.
   a. Angin-anginkan kedelai sampai uap hilang dan tidak ada air yang menetes.
   b. Pastikan suhunya hangat kuku sebelum diberi ragi karena suhu panas mematikan ragi.
4. Campur ragi.
   a. Taburkan ragi tempe lalu aduk dengan tangan bersih.
   b. Aduk selama 3 menit agar seluruh biji terkena ragi.
5. Bungkus dan peram.
   a. Masukkan ke bungkus daun pisang atau plastik berlubang supaya udara dapat masuk.
   b. Simpan di tempat teduh selama 36 sampai 48 jam.
6. Periksa kematangan.
   a. Tempe jadi bila kedelai terikat benang jamur putih yang rapat dan berbau khas.
   b. Buang bila muncul bercak hitam pekat atau berbau busuk.

Catatan
Peragian kurang berhasil bila kedelai terlalu basah atau alat tidak bersih.`;

const pend={};
function save(path,data){
  const p=pend[path]=pend[path]||{data:null,running:false};
  p.data=data;if(p.running)return;p.running=true;
  (async()=>{
    while(p.data){const d=p.data;p.data=null;
      try{await DL.db.doc(path).set(d)}catch(e){writeFail(e)}
    }
    p.running=false;
  })();
}
async function waitSaves(ms=6000){
  const t0=Date.now();
  while(Object.values(pend).some(p=>p.running||p.data)&&Date.now()-t0<ms)await new Promise(r=>setTimeout(r,80));
}

function writeFail(e){

    DL.blocked=true;bus.emit('status');
    if(!DL.warned){DL.warned=true;toast('Data hanya tersimpan di perangkat ini. Minta guru membuka akses Kontributor.',6000)}
  }else if(c==='quota_exceeded'){toast('Penyimpanan penuh. Hubungi guru.',5000)}

}

const PK_SHA='3fd5bede592ea2654a2564ab9bed52e22ff34aaaecdf01a7a16153cb260ebd3a',PK_ALT=8591248873089783;
function cyrb53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}
async function pkCheck(v){
  const s='smartbox-paskey:'+String(v).trim();
  try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')===PK_SHA}}catch(e){}
  return cyrb53(s)===PK_ALT;
}

function nav(patch){
  if(!isT()&&S.live.lock){toast('Guru sedang memimpin. Ikuti layar guru ya.');return}
  const prev=view.face;Object.assign(view,patch);
  const changed=patch.face&&patch.face!==prev;
  if(changed){
    if(patch.face==='materi')view.sub='gaya';
    if(patch.face==='asesmen'){view.gsub='kelompok';view.game=null}
  }
  renderPanel();
  if(isT()&&broadcast){
    const l={face:view.face,sub:view.sub,gsub:view.gsub,style:view.style,game:view.game};
    if(changed)l.open=null;setLive(l);
    if(changed&&viewerEl)closeViewer();
  }
}
const go=f=>nav({face:f});
const navKey=l=>[l.face,l.sub,l.gsub,l.style,l.game,l.pull].join('|');
let lastNav='',lastOpen=null;
function followLive(initial){
  if(isT()||!S.me)return;
  const l=S.live;const k=navKey(l);
  if(k!==lastNav||initial){
    lastNav=k;
    Object.assign(view,{face:l.face,sub:l.sub||'gaya',gsub:l.gsub||'kelompok',game:l.game||null});
    if(l.style)view.style=l.style;
    renderPanel();
  }
  if(l.open!==lastOpen||initial){
    lastOpen=l.open;
    const it=l.open&&allMateri().find(m=>m.id===l.open);
    if(it){openViewer(it);toast('Guru menampilkan: '+it.title)}else if(viewerEl)closeViewer();
  }
  updateTabs();renderLiveBar();
}

/* ================= kotak 3D ================= */
const cam={tilt:58,spin:-20,ty:.42,k:1.12};
let camMode='idle';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const ptr={x:.5,y:.5};
addEventListener('pointermove',e=>{ptr.x=e.clientX/innerWidth;ptr.y=e.clientY/innerHeight},{passive:true});
function camApply(){$('#cam').style.transform=`translate3d(0,calc(var(--s)*${cam.ty}),0) scale(${cam.k}) rotateX(${cam.tilt}deg) rotateZ(${cam.spin}deg)`}
function frame(t){
  if(camMode==='idle')cam.spin=reduce?-14:Math.sin(t/2600)*26;
  else if(camMode==='ready'&&!reduce){cam.spin+=((ptr.x-.5)*10-cam.spin)*.06;cam.tilt+=(50+(.5-ptr.y)*6-cam.tilt)*.06}
  camApply();requestAnimationFrame(frame);
}
function tweenCam(to,ms){
  camMode='tween';const from={...cam},t0=performance.now();
  return new Promise(res=>{
    const step=t=>{
      const p=Math.min(1,(t-t0)/ms),e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
      for(const k in to)cam[k]=from[k]+(to[k]-from[k])*e;
      p<1?requestAnimationFrame(step):res();
    };requestAnimationFrame(step);
  });
}
function burst(){
  const b=$('#burst');b.replaceChildren();
  const cols=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','#fff'];
  for(let i=0;i<30;i++){
    const a=Math.random()*Math.PI*2,r=90+Math.random()*190;
    b.append(h('span',{style:{'--c':cols[i%5],'--dx':Math.cos(a)*r+'px','--dy':Math.sin(a)*r*.7-30+'px','--r':Math.random()*540-270+'deg',animationDelay:Math.random()*.15+'s',borderRadius:i%3?'3px':'50%'}}));
  }
  setTimeout(()=>b.replaceChildren(),1700);
}

const FILE_MAX=240000,fileCache={};
const readDataUrl=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
async function prepFile(f){
  if(/^image\//.test(f.type)&&f.type!=='image/gif'&&f.type!=='image/svg+xml'){
    const url=URL.createObjectURL(f);
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    let sc=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight)),out=null;
    for(let round=0;round<6&&!out;round++){
      const w=Math.max(1,Math.round(img.naturalWidth*sc)),hh=Math.max(1,Math.round(img.naturalHeight*sc));
      const cv=document.createElement('canvas');cv.width=w;cv.height=hh;const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,hh);cx.drawImage(img,0,0,w,hh);
      for(let q=.85;q>=.4;q-=.15){const d=cv.toDataURL('image/jpeg',q);if(d.length<=FILE_MAX){out=d;break}}
      sc*=.75;
    }
    URL.revokeObjectURL(url);
    if(!out)throw new Error('big');
    return{data:out,mime:'image/jpeg',name:f.name.replace(/\.[^.]+$/,'')+'.jpg'};
  }
  const d=await readDataUrl(f);if(d.length>FILE_MAX)throw new Error('big');
  return{data:d,mime:f.type||'application/octet-stream',name:f.name};
}

function makeGroups(list,n){
  const by={T:[],S:[],R:[]};list.forEach(s=>by[levelOf(s.key)].push(s));
  const order=[...shuffle(by.T),...shuffle(by.S),...shuffle(by.R)];
  const teams=Array.from({length:n},(_,i)=>({id:'t'+i,name:'',members:[]}));
  order.forEach((s,i)=>{
    const r=Math.floor(i/n),p=i%n,idx=r%2===0?p:n-1-p;
    teams[idx].members.push({key:s.key,name:s.name,kelas:s.kelas,level:levelOf(s.key)});
  });
  const names=shuffle(TEAMS);
  teams.forEach((t,i)=>{t.name=names[i%names.length]+(i>=names.length?' '+(Math.floor(i/names.length)+1):'')});
  return teams;
}
function teamsGrid(g,teacher){

function gameRoda(){
  const box=h('div',{class:'card'});
  let src=(S.groups&&S.groups.teams.length)?'tim':'murid',rot=0,spinning=false;
  const custom=h('textarea',{class:'in',id:'rd-custom',rows:'3',placeholder:'Satu nama per baris'});
  const srcSel=h('select',{class:'in',id:'rd-src',style:{width:'auto'}},h('option',{value:'tim'},'Tim dari kelompok'),h('option',{value:'murid'},'Murid di daftar'),h('option',{value:'kustom'},'Daftar sendiri'));
  srcSel.value=src;
  const removed=new Set();
  const names=()=>{
    let a=[];
    if(srcSel.value==='tim')a=((S.groups&&S.groups.teams)||[]).map(t=>'Tim '+t.name);
    else if(srcSel.value==='murid')a=roster().map(r=>first(r.name)+(r.kelas?' '+r.kelas:''));
    else a=custom.value.split('\n').map(s=>s.trim()).filter(Boolean);
    return a.filter(x=>!removed.has(x));
  };
  const cv=h('canvas',{width:760,height:760,'aria-label':'Roda putar'});
  const res=h('div',{class:'result',role:'status'});
  const pal=()=>{const st=getComputedStyle(document.documentElement);return['--c1','--c2','--c3','--c4'].map(v=>st.getPropertyValue(v).trim()||'#7cf')};
  const draw=()=>{
    const ctx=cv.getContext('2d'),W=cv.width,c=W/2,r=c-10,ns=names(),n=ns.length;
    ctx.clearRect(0,0,W,W);const st=getComputedStyle(document.documentElement);const ol=st.getPropertyValue('--outline').trim()||'#123';
    if(!n){ctx.fillStyle=ol;ctx.font='800 34px sans-serif';ctx.textAlign='center';ctx.fillText('Isi daftar dulu',c,c);return}
    const seg=Math.PI*2/n,col=pal();
    for(let i=0;i<n;i++){
      ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,r,rot+i*seg-Math.PI/2,rot+(i+1)*seg-Math.PI/2);ctx.closePath();
      let k=i%4;if(i===n-1&&n>1&&k===0)k=2;ctx.fillStyle=col[k];ctx.fill();ctx.lineWidth=7;ctx.strokeStyle=ol;ctx.stroke();
      ctx.save();ctx.translate(c,c);ctx.rotate(rot+(i+.5)*seg-Math.PI/2);ctx.textAlign='right';ctx.fillStyle='#10213a';
      const fs=Math.max(20,Math.min(40,300/Math.max(6,n)*1.6));ctx.font=`800 ${fs}px "Baloo 2",sans-serif`;
      const t=ns[i].length>13?ns[i].slice(0,12)+'…':ns[i];ctx.fillText(t,r-28,fs/3);ctx.restore();
    }
    ctx.beginPath();ctx.arc(c,c,46,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=7;ctx.strokeStyle=ol;ctx.stroke();
  };
  const spin=()=>{
    if(spinning)return;const ns=names();if(!ns.length){toast('Daftar masih kosong');return}
    spinning=true;res.textContent='';
    const r0=rot,total=(5+Math.random()*3)*Math.PI*2+Math.random()*Math.PI*2,dur=reduce?10:4300,t0=performance.now();
    const step=t=>{
      const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3.4);rot=r0+total*e;draw();
      if(p<1)requestAnimationFrame(step);
      else{
        spinning=false;const seg=Math.PI*2/ns.length,m=((-rot)%(Math.PI*2)+Math.PI*2)%(Math.PI*2),w=ns[Math.min(ns.length-1,Math.floor(m/seg))];
        res.replaceChildren(w,' ',h('button',{class:'btn sm ghost',type:'button',onclick:()=>{removed.add(w);res.textContent='';draw()}},'Keluarkan dari roda'));burst2();
      }
    };requestAnimationFrame(step);
  };
  const burst2=()=>{};
  [srcSel,custom].forEach(e=>e.addEventListener('input',()=>{removed.clear();res.textContent='';draw()}));
  const custWrap=field('Daftar nama',custom);custWrap.hidden=true;
  srcSel.addEventListener('change',()=>{custWrap.hidden=srcSel.value!=='kustom'});
  box.append(h('div',{class:'row'},field('Isi roda',srcSel)),custWrap,
    h('div',{class:'wheel-wrap'},h('div',{class:'wheel-box'},h('div',{class:'pin'}),cv),res,
      h('button',{class:'btn lg warm',type:'button',onclick:spin},ico('wheel'),'Putar roda')));
  draw();track(bus.on('groups',draw));track(bus.on('resp',draw));
  return box;
}
function gamePasangan(){

function makeTables(size){
  const g=S.groups;if(!g)return null;
  const ps=[];g.teams.forEach(t=>t.members.forEach(m=>ps.push({key:m.key,name:m.name,team:t.id,teamName:t.name,level:m.level||levelOf(m.key)})));
  const by={T:[],S:[],R:[]};ps.forEach(p=>by[p.level].push(p));
  let rest=[...shuffle(by.T),...shuffle(by.S),...shuffle(by.R)];const tables=[];
  while(rest.length){
    const tb=[],used=new Set();
    for(let i=0;i<rest.length&&tb.length<size;){if(!used.has(rest[i].team)){tb.push(rest[i]);used.add(rest[i].team);rest.splice(i,1)}else i++}
    if(!tb.length)tb.push(rest.shift());tables.push(tb);
  }
  if(tables.length>1&&tables[tables.length-1].length===1){const l=tables.pop();tables[tables.length-1].push(l[0])}
  return tables.map((pl,i)=>({id:'tb'+i,no:i+1,players:pl,ranks:{}}));
}

function playStep(id,i,t){
  const k=i%8,bar=Math.floor(i/8)%4;

    const ch=PIANO_PROG[bar],ix=[0,1,2,1,2,1,2,1][k];

    if(k===4&&Math.random()<.5)INST.piano(ch[2]+12+(Math.random()<.5?0:2),t,2);
  }else if(id==='kotak'){
    if(i%2===0&&Math.random()<.82){walk=Math.max(0,Math.min(PENT.length-1,walk+[-2,-1,-1,0,1,1,2][Math.floor(Math.random()*7)]));INST.box(PENT[walk],t)}

  }else if(id==='gamelan'){
    if(i%32===0)INST.gam(48,t,4);
    if(k===4)INST.gam(60,t,1.8);
    if(i%2===0)INST.gam(GAM_MOTIF[(i/2)%GAM_MOTIF.length]+(Math.floor(i/32)%2?-2:0),t);

}

            h('td',{class:'wrap'},s.feel&&s.feel.note||'-'),h('td',null,s.style?STYLES.find(x=>x.id===s.style).t:'-'),
            h('td',{class:'wrap',style:{whiteSpace:'pre-wrap'}},exs||'-'),h('td',null,sel),
            h('td',null,rec?confirmBtn('Hapus','Yakin?',()=>delResp(r.key),'btn sm ghost'):null));
        })));
      tblW.replaceChildren(h('div',{class:'tbl-wrap',style:{maxHeight:'420px',overflow:'auto'}},tb));
    };
    const sesSel=h('select',{class:'in',id:'rs-sesi',style:{width:'auto'},onchange:()=>{sd=sesSel.value;draw()}},sesiList().map(([k,v])=>h('option',{value:k},v)));
    sesSel.value=sd;
    const dlBtn=h('button',{class:'btn mint',type:'button',onclick:async()=>{
      const csv='﻿'+buildCsv(sd);let ok=false;
      try{const d=window.claude&&await claude.use('downloads');if(d){await d.save({filename:'hasil-smartbox-'+sd+'.csv',data:csv});ok=true}}catch(e){}
      if(!ok){
        const ta=h('textarea',{class:'in',rows:'6',readonly:true,'aria-label':'Isi CSV'},buildCsv(sd));
        csvBox.replaceChildren(h('p',{class:'hint'},'Unduhan tidak tersedia di sini. Salin isi berikut lalu tempel ke spreadsheet.'),ta,h('div',{class:'row'},h('button',{class:'btn sm ghost',type:'button',onclick:()=>copyText(ta.value)},ico('copy'),'Salin CSV')));ta.select();
      }
    }},ico('download'),'Unduh CSV');
    const gUrl=h('input',{class:'in',id:'gas-url',inputmode:'url',placeholder:'https://script.google.com/macros/s/…/exec'});gUrl.value=LS.get('gas')||GAS_DEFAULT;
    const gKode=h('input',{class:'in',id:'gas-kode',type:'password',autocomplete:'off',placeholder:'Kode rahasia (jika diisi di skrip)'});gKode.value=LS.get('gaskode')||'';
    const gSt=h('div',{class:'hint',role:'status'});
    gUrl.addEventListener('change',()=>LS.set('gas',gUrl.value.trim()));gKode.addEventListener('change',()=>LS.set('gaskode',gKode.value));
    const gCard=h('div',{class:'card'},h('h3',null,'Nilai ke Google Sheets'),
      h('p',{class:'hint'},'Unduh data nilai atau kirim ke Google Sheet lewat Google Apps Script (kode ada di berkas Kode_Google_Apps_Script.txt).'),
      h('div',{class:'row'},h('button',{class:'btn warm',type:'button',onclick:async()=>{const ok=await saveText('nilai-smartbox-'+sd+'.json',JSON.stringify(buildPayload(sd),null,1));gSt.textContent=ok?'Berkas JSON diunduh. Impor lewat menu Smartbox di Google Sheet.':'Unduhan gagal.'}},ico('download'),'Unduh JSON')),
      h('div',{class:'grid'},field('Alamat Web App Apps Script',gUrl),field('Kode rahasia (opsional)',gKode)),
      h('div',{class:'row'},h('button',{class:'btn mint',type:'button',onclick:()=>{LS.set('gas',gUrl.value.trim());LS.set('gaskode',gKode.value);sendSheet(sd,gSt)}},ico('check'),'Kirim ke Google Sheets')),gSt);
    body.append(h('div',{class:'row between'},h('div',{class:'row'},field('Sesi',sesSel)),dlBtn),csvBox,gCard,stats,
      h('div',{class:'card'},h('h3',null,'Perasaan'),mood),h('div',{class:'card'},h('h3',null,'Exit ticket'),ex),
      h('div',{class:'card'},h('h3',null,'Per murid'),tblW));
    draw();offs.push(bus.on('resp',draw),bus.on('cfg',draw));
  },{wide:true,onClose:()=>offs.forEach(f=>f())});
}

/* ================= pengaturan (guru) ================= */
function openSettings(){
  openModal('Pengaturan kelas',(body,close)=>{
    const c0=S.cfg;
    const judul=h('input',{class:'in',id:'st-judul',maxlength:'40'});judul.value=c0.judul;
    const mapel=h('input',{class:'in',id:'st-mapel',maxlength:'40'});mapel.value=c0.mapel;
    const topik=h('input',{class:'in',id:'st-topik',maxlength:'60'});topik.value=c0.topik;
    const kelas=h('input',{class:'in',id:'st-kelas',maxlength:'80',placeholder:'5A, 5B'});kelas.value=(c0.kelas||[]).join(', ');
    const sesi=h('input',{class:'in',id:'st-sesi',maxlength:'40'});sesi.value=c0.sesi.label;
    const tpIn=h('textarea',{class:'in',id:'st-tp',rows:'5',placeholder:'Satu tujuan pembelajaran per baris'},(c0.tp||[]).join('\n'));
    let tema=c0.tema;
    const sw=h('div',{class:'swatches',role:'group','aria-label':'Tema warna'});
    const paint=()=>{sw.replaceChildren(...Object.entries(TEMAS).map(([k,v])=>{const c=TEMA_SW[k];
      return h('button',{type:'button',class:'sw','aria-pressed':String(tema===k),style:{'--a':c[0],'--b':c[1],'--c':c[2],'--d':c[3]},onclick:()=>{tema=k;document.documentElement.dataset.tema=k;paint()}},h('i'),v)}))};paint();
    body.append(
      h('div',{class:'grid'},field('Judul kotak',judul),field('Mata pelajaran',mapel),field('Topik pembelajaran',topik),field('Daftar kelas (pisahkan koma)',kelas)),
      h('div',{class:'field'},h('span',null,'Tema warna (sesuaikan dengan topik)'),sw),
      field('Nama sesi saat ini',sesi,'Hasil perasaan dan exit ticket dicatat per sesi.'),
      field('Tujuan pembelajaran (TP)',tpIn,'Tampil di sisi Materi untuk murid. Satu tujuan per baris.'),
      h('div',{class:'row'},h('button',{class:'btn mint',type:'button',onclick:()=>{
        setCfg(c=>{c.judul=judul.value.trim()||'SMART BOX';c.mapel=mapel.value.trim();c.topik=topik.value.trim();c.tema=tema;c.sesi.label=sesi.value.trim()||c.sesi.label;c.tp=tpIn.value.split('\n').map(s=>s.trim()).filter(Boolean);
          c.kelas=kelas.value.split(',').map(s=>s.trim()).filter(Boolean)});
        toast('Pengaturan disimpan');close();
      }},ico('check'),'Simpan'),h('button',{class:'btn ghost',type:'button',onclick:()=>{document.documentElement.dataset.tema=c0.tema;close()}},'Batal')),
      h('hr',{style:{width:'100%',border:'0',borderTop:'3px dashed var(--line)'}}),
      h('h4',null,'Alat guru'),
      h('div',{class:'row'},
        h('button',{class:'btn sm ghost',type:'button',onclick:()=>{close();editGames()}},ico('pencil'),'Atur isi game'),
        h('button',{class:'btn sm ghost',type:'button',onclick:()=>{close();editExit()}},ico('pencil'),'Atur exit ticket'),
        confirmBtn('Muat paket Teks Prosedur Kompleks','Yakin? Materi, soal, dan exit ticket bawaan diganti',()=>{setCfg(c=>{const p=JSON.parse(JSON.stringify(TPK_PAKET));PAKET_KEYS.forEach(k=>{c[k]=p[k]});c.pv=p.pv});toast('Paket Teks Prosedur Kompleks dimuat');close()},'btn sm'),
        confirmBtn('Mulai sesi baru','Yakin? Data lama tetap tersimpan',()=>{
          setCfg(c=>{c.sesiList=c.sesiList||[];if(!c.sesiList.some(s=>s.id===c.sesi.id))c.sesiList.push({...c.sesi});const n=c.sesiList.length+1;c.sesi={id:'p'+Date.now().toString(36),label:'Pertemuan '+n}});
          setGroups(null);setTgt(t=>{t.teams=[];t.tables=null;t.tablesShown=false});toast('Sesi baru dimulai');close();
        }),
        confirmBtn('Hapus isi contoh','Yakin hapus semua contoh?',()=>{setCfg(c=>{c.materi=c.materi.filter(m=>!m.contoh);c.ext=c.ext.filter(m=>!m.contoh)});toast('Contoh dihapus');close()}),
        confirmBtn('Hapus semua data murid','Yakin? Tidak bisa dibatalkan',async()=>{for(const k of Object.keys(S.resp))await delResp(k);toast('Data murid dihapus');close()},'btn sm danger')),
      h('div',{class:'card',style:{boxShadow:'none'}},h('h4',null,'Agar murid bisa mengirim jawaban dari perangkat mereka'),
        h('p',{class:'hint'},'Bagikan Smartbox lewat tombol Bagikan di Claude dan beri akses Kontributor. Murid harus bisa membuka halaman dengan akun yang punya akses menulis. Bila tidak, jalankan kelas dari layar guru: tulis nama murid satu per satu di layar kelas, atau gunakan daftar nama di tab Kelompok.')));
  });
}

/* ================= mulai ================= */
function studentKey(name,kelas){
  if(!DL.canTeach&&DL.uid)return String(DL.uid);
  return slug(kelas+'-'+name);
}
function enterGuru(){
  musicUnlock();
  askPaskey(async()=>{await ready;enter({role:'guru',name:'Guru',kelas:'-',key:'guru'})},'Mode guru hanya untuk pemegang Paskey. Masukkan Paskey untuk masuk.');
}
function boot(){
  const th=LS.get('theme');if(th)document.documentElement.dataset.theme=th;
  buildSky();buildBox();applyLook();renderTop();buildMusicUI();
  bus.on('cfg',()=>{applyLook();updateTabs()});
  bus.on('live',()=>{if(!isT())followLive();updateTabs();renderLiveBar();renderTop();musicFollow()});
  const guruBtn=$('#f-guru');
  bus.on('status',()=>{renderTop()});
  requestAnimationFrame(frame);
  ready=initData();
  const datalist=$('#kelas-list');
  const fillKelas=()=>{datalist.replaceChildren(...(S.cfg.kelas||[]).map(k=>h('option',{value:k})))};fillKelas();bus.on('cfg',fillKelas);
  const form=$('#login'),err=$('#f-err'),stage=$('#stage');
  const shake=()=>{stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake');setTimeout(()=>stage.classList.remove('shake'),520)};
  stage.addEventListener('click',()=>{if(!S.me){$('#f-name').focus();shake()}});
  form.addEventListener('submit',async e=>{
    e.preventDefault();
    const name=$('#f-name').value.trim().replace(/\s+/g,' '),kelas=$('#f-kelas').value.trim();
    if(name.length<2){err.textContent='Tulis nama lengkapmu dulu ya.';shake();$('#f-name').focus();return}
    if(!kelas){err.textContent='Isi kelasmu dulu ya.';shake();$('#f-kelas').focus();return}
    musicUnlock();err.textContent='';const btn=$('#f-go');btn.disabled=true;
    await ready;btn.disabled=false;
    enter({role:'murid',name,kelas,key:studentKey(name,kelas)});
  });
  guruBtn.addEventListener('click',()=>enterGuru());
  ready.then(()=>{
    const me=LS.get('me');
    if(me&&me.name&&me.role==='murid'){
      if(me.role==='murid')me.key=studentKey(me.name,me.kelas);
      $('#f-name').value=me.role==='murid'?me.name:'';$('#f-kelas').value=me.role==='murid'?me.kelas:'';
      enter(me,true);
    }
  });
}
boot();
})();
